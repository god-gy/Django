{% for field in form %}
    <div class="form-group row mb-2">
        <label class="form-label col-md-3" for="{{ field.auto_id }}">{{ field.label }}</label>
        <div class="col-md-9">
            {{ field }}
        </div>

        {% for error in field.errors %}
            <span class="text-danger">{{ error }}</span>
        {% endfor %}
    </div>
{% endfor %}

{% for error in form.non_field_errors %}
    <p>{{ error }}</p>
{% endfor %}
